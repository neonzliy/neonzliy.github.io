<footer class="chapter chapter-contact" id="contact" aria-labelledby="contact-heading">
  <div class="chapter-copy">
    <p class="eyebrow"><span>06</span> At rest</p>
    <h2 id="contact-heading">Let's connect.</h2>
    <a class="contact-email" href="mailto:{{ site.social-network-links.email }}">{{ site.social-network-links.email }} <span aria-hidden="true">↗</span></a>
    <nav class="social-links" aria-label="Social links">
      <a href="https://github.com/{{ site.social-network-links.github }}">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/{{ site.social-network-links.linkedin }}">LinkedIn ↗</a>
      <a href="https://www.instagram.com/{{ site.social-network-links.instagram }}">Instagram ↗</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
    </nav>
    <p class="colophon">{{ page.title }} <span aria-hidden="true">/</span> {{ site.url-pretty }}</p>
    <a class="back-top" href="#intro">Back to the beginning ↑</a>
  </div>
</footer>
