about:
  lead: "Leon builds and evaluates AI products, and designs the systems that help organizations adopt them well. His work draws on behavior design, data science leadership, causal inference, and machine learning."
  detail: "At Dropbox, his recent work centers on AI product evaluation: defining model and product quality, connecting it to user outcomes, and measuring cost and latency alongside product value. He also designs reusable workflows, shapes adoption strategy, and rigorously validates decision models."
  focus:
    - "AI-Native Adoption"
    - "AI Evaluation & Quality"
    - "Evidence & Experimentation"

work_intro:
  title: "The systems behind useful AI."
  body: "Selected themes from recent work across workflow design, product measurement, and decision science, generalized here for public sharing."

recent_work:
  - number: "01"
    title: "AI-native workflows, made reusable"
    description: "Prototyped a governed approach for making individual AI workflows reusable, with clear ownership, human review, attribution, and adoption feedback loops."
    role: "AI Practice"
    year: "2026 · Practice design"
    context: "Workflow adoption"
    focus: "Reusable workflows · Governance"
    href: "/me/"
    link_label: "Read the approach"
  - number: "02"
    title: "Evaluation systems for AI products"
    description: "Developed a measurement framework spanning quality, latency, cost, engagement, and experimentation, brought together through dashboards and an interactive metric tree for product decisions."
    role: "AI Evaluation"
    year: "2026 · Evaluation framework"
    context: "AI product measurement"
    focus: "Metric trees · Decision systems"
    href: "/me/"
    link_label: "Read the approach"
  - number: "03"
    title: "Decision models that show their uncertainty"
    description: "Pressure-tested a business-driver model by separating robust signals from weak associations, tiering the evidence, and defining causal follow-up around what was known, what remained uncertain, and what to test next."
    role: "Decision Science"
    year: "2026 · Model review"
    context: "Decision analysis"
    focus: "Evidence tiers · Causal follow-up"
    href: "/me/"
    link_label: "Read the approach"
